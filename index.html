// ── Dynamic deadline badges ──────────────────────────────────────────────────
function renderDeadlines() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  document.querySelectorAll('.deadline[data-deadline]').forEach(el => {
    const raw = el.dataset.deadline;
    // Parse as local date (YYYY-MM-DD) to avoid UTC offset shifting the day
    const [y, m, d] = raw.split('-').map(Number);
    const due = new Date(y, m - 1, d);
    const diff = Math.round((due - today) / 86400000); // whole days

    let icon, label, cls;
    if (diff < 0) {
      icon = '❌';
      label = `${raw.slice(5).replace('-', ' ')} — EXPIRED`;
      cls = 'dl-expired';
    } else if (diff === 0) {
      icon = '🚨';
      label = 'TODAY';
      cls = 'dl-urgent';
    } else if (diff <= 5) {
      icon = '⚠';
      const s = diff === 1 ? 'day' : 'days';
      label = `${formatDate(due)} — ${diff} ${s}`;
      cls = 'dl-urgent';
    } else if (diff <= 14) {
      icon = '⏳';
      label = formatDate(due);
      cls = 'dl-warn';
    } else {
      icon = '📆';
      label = formatDate(due);
      cls = 'dl-ok';
    }
    el.className = `deadline ${cls}`;
    el.textContent = `${icon} ${label}`;
  });
}

function formatDate(d) {
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
